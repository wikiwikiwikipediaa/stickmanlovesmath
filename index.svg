<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     style="display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#2e5cb3">
  <title>Yo-Kai Watch Wibble Wobble</title>
  <defs>
    <pattern id="blue-pattern" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#2e5cb3"/>
      <path d="M3 4h18v13h17V4h15M3 29h11V17h12v24H10v12h39V39H36v14M3 4v13m50-13v13"
            fill="none" stroke="#3b6bc3" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#blue-pattern)"/>
  <metadata id="embedded-html-base64"><![CDATA[]]></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:div id="viewport" xmlns:xhtml="http://www.w3.org/1999/xhtml">
      <xhtml:style><![CDATA[
        html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
        #viewport { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; overflow:hidden; }
        .game-stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
          width:min(100vw,56.338vh); height:min(100vh,177.5vw); overflow:hidden;
          border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.35); background:#000; }
        @supports (height:100dvh) { .game-stage { width:min(100vw,56.338dvh); height:min(100dvh,177.5vw); } }
        #game-frame { display:block; width:100%; height:100%; border:0; background:#000; }
        #fullscreen-toggle { position:fixed; z-index:20; top:10px; right:10px; width:44px; height:44px;
          border:1px solid rgba(255,255,255,.6); border-radius:10px; background:rgba(8,24,60,.72);
          color:white; font:700 22px/1 system-ui,sans-serif; cursor:pointer; touch-action:manipulation; }
        #fullscreen-toggle:focus-visible { outline:3px solid white; outline-offset:2px; }
      ]]></xhtml:style>
      <xhtml:div class="game-stage">
        <xhtml:iframe id="game-frame" title="Yo-Kai Watch Wibble Wobble" allow="autoplay; fullscreen"
          style="display:block;width:100%;height:100%;border:0;background:#000"></xhtml:iframe>
      </xhtml:div>
      <xhtml:button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</xhtml:button>
    </xhtml:div>
  </foreignObject>
  <script type="application/ecmascript"><![CDATA[
    (() => {
      const payload = document.getElementById("embedded-html-base64").textContent.trim();
      const binary = atob(payload);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      const html = new TextDecoder("utf-8").decode(bytes);
      document.getElementById("game-frame").srcdoc = html;

      const button = document.getElementById("fullscreen-toggle");
      const syncButton = () => {
        const active = document.fullscreenElement === document.documentElement;
        button.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
        button.title = active ? "Exit fullscreen (Esc)" : "Enter fullscreen";
      };
      button.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) {
          button.title = "Fullscreen is controlled by your browser";
        }
      });
      document.addEventListener("fullscreenchange", syncButton);
    })();
  ]]></script>
</svg>
